#:schema https://fnox.jdx.dev/schema.json
# claude-rig's secrets: their names and where the values are kept, never a value.
# The rules: docs/concepts/secrets.md. mise.toml selects the claude-rig profile, alone, so a
# task run under `fnox exec` gets these and nothing else from the global fnox config.
root = true
# Into `fnox exec` commands only, never into an interactive shell an agent may be using.
env = "exec"

# The same provider as the owner's global fnox config, so this file also works without it.
[providers.keychain]
type = "keychain"
service = "fnox"

# None at this commit. A machine's fleet-api token is made by fleet-api's own access:token task,
# under fleet-api's fnox profile (push runs it in fleet-api's checkout), and kept on that machine
# alone (docs/concepts/reporting.md).
[profiles.claude-rig.secrets]
