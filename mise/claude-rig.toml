# The tools every rigged machine gets, the same list on every OS.
#
# The rig copies this file to ~/.config/mise/conf.d/claude-rig.toml, so the
# tools are on hand in every folder, and the machine's own mise config is
# left alone. Versions match the Mac that the Claude config is captured from.

[tools]
ast-grep = "0.45.3"
bun = "1.4.2"
fd = "10.5.0"
fnox = "1.36.0"
gh = "2.101.0"
git-lfs = "3.8.0"
go = "1.27.1"
jq = "1.8.2"
node = "24.19.0"
nu = "0.116.0"
pitchfork = "2.29.0"
ripgrep = "15.2.0"
shellcheck = "0.11.0"
usage = "6.12.0"
yq = "4.53.6"
