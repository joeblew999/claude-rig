[tools]
nu = "0.116.0"
shellcheck = "latest"

[tasks.rig]
description = "Rig this machine: tools, Claude Code, Claude config. Pass --dry-run to only look."
run = "nu tasks/rig.nu"

[tasks.doctor]
description = "Show what is set up on this machine and what is missing. Changes nothing. Pass --json for a machine-readable report."
run = "nu tasks/doctor.nu"

[tasks.fleet]
description = "Every rigged machine in one table: this one and each machine rigged from here with push."
run = "nu tasks/fleet.nu"

[tasks.unrig]
description = "Take this machine out of the fleet: stop the always-on session. Pass --dry-run to only look."
run = "nu tasks/unrig.nu"

[tasks.apply]
description = "Apply claude/ to this machine's ~/.claude. Pass --dry-run to only look."
run = "nu tasks/apply.nu"

[tasks.capture]
description = "Copy this Mac's global Claude config (~/.claude) into claude/"
run = "nu tasks/capture.nu"

[tasks.push]
description = "Rig a remote machine over SSH: mise run push user@host. Pass --dry-run to only look."
run = "nu tasks/push.nu"

[tasks.test]
description = "Run the tests: the config merge against throwaway Claude folders"
run = "nu tests/apply.nu"

[tasks.lint]
description = "Check the scripts"
run = [
  "shellcheck bootstrap.sh",
  "nu --commands 'for f in (glob tasks/*.nu | append (glob tests/*.nu)) { nu-check --debug $f }'",
]
