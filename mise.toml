[tools]
nu = "0.116.0"
shellcheck = "latest"
# charter writes and checks the docs site the same way in every repo of the owner's.
"github:joeblew999/charter" = "0.9.0"
# The VM tool: makes the UTM VMs that `mise run vm` enrols (macOS only).
"github:joeblew999/irgo-windows-vm" = { version = "0.7.0", os = ["macos"], asset_pattern = "irgo-winvm-darwin-arm64", bin = "irgo-winvm" }

[tasks.rig]
description = "Rig this machine: tools, Claude Code, Claude config. Pass --dry-run to only look."
run = "nu tasks/rig.nu"

[tasks.doctor]
description = "Show what is set up on this machine and what is missing. Changes nothing. Pass --json for a machine-readable report."
run = "nu tasks/doctor.nu"

[tasks.fleet]
description = "Every rigged machine in one table: this one and each machine rigged from here with push."
run = "nu tasks/fleet.nu"

[tasks.vm]
description = "A UTM VM on this Mac, made and rigged in one step: mise run vm -- new linux <name>, or rm <name>"
run = "nu tasks/vm.nu"

[tasks.unrig]
description = "Take this machine out of the fleet: stop the always-on session. Pass --dry-run to only look."
run = "nu tasks/unrig.nu"

[tasks.apply]
description = "Apply claude/ to this machine's ~/.claude. Pass --dry-run to only look."
run = "nu tasks/apply.nu"

[tasks.capture]
description = "Copy this Mac's global Claude config (~/.claude) into claude/"
run = "nu tasks/capture.nu"

[tasks.push]
description = "Rig a remote machine over SSH: mise run push user@host. Pass --dry-run to only look."
run = "nu tasks/push.nu"

[tasks.test]
description = "Run the tests: the config merge, the capture checks and the claims, against throwaway folders"
run = ["nu tests/apply.nu", "nu tests/capture.nu", "nu tests/claims.nu"]

[tasks."plugin:check"]
description = "Check the Claude Code plugin in plugin/ and the marketplace file with Claude Code's own validator (needs claude)"
run = ["claude plugin validate .", "claude plugin validate plugin"]

[tasks.lint]
description = "Check the scripts"
run = [
  "shellcheck bootstrap.sh",
  "nu --commands 'for f in (glob tasks/*.nu | append (glob tests/*.nu)) { nu-check --debug $f }'",
]

# ---- docs: the docs site in docs/, kept the way charter keeps it ----

[tasks."docs:setup"]
description = "Write the docs site's config, docs/writing.md and docs/llms.txt (the same for every repo that uses charter)"
run = "charter docs"

[tasks."docs:lint"]
description = "Check docs/ for what a program can check: front matter, links, the index, tasks and paths that don't exist"
run = "charter docs-lint"

[tasks."docs:check"]
description = "docs:lint, and fail if the generated docs files are stale"
run = "charter docs -check && charter docs-lint"

[tasks."docs:review"]
description = "Have Claude bring docs/ up to date and into line with docs/writing.md"
run = "charter docs-review"

[tasks."docs:pages"]
description = "REMOTE, once per repo: turn on GitHub Pages for docs/ on main"
run = 'gh api -X POST "repos/{owner}/{repo}/pages" -f "source[branch]=main" -f "source[path]=/docs"'

