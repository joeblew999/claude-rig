[tools]
nu = "0.116.0"
shellcheck = "latest"

[tasks.rig]
description = "Rig this machine: tools, Claude Code, Claude config. Pass --dry-run to only look."
run = "nu tasks/rig.nu"

[tasks.apply]
description = "Apply claude/ to this machine's ~/.claude. Pass --dry-run to only look."
run = "nu tasks/apply.nu"

[tasks.capture]
description = "Copy this Mac's global Claude config (~/.claude) into claude/"
run = "nu tasks/capture.nu"

[tasks.lint]
description = "Check the scripts"
run = [
  "shellcheck bootstrap.sh",
  "nu --commands 'for f in (glob tasks/*.nu) { nu-check --debug $f }'",
]
