[tools]
nu = "0.116.0"
shellcheck = "latest"
# charter writes and checks the docs site the same way in every repo of the owner's.
"github:joeblew999/charter" = "0.9.0"
# The VM tool: makes the UTM VMs that `mise run vm` enrols (macOS only).
"github:joeblew999/irgo-windows-vm" = { version = "0.7.0", os = ["macos"], asset_pattern = "irgo-winvm-darwin-arm64", bin = "irgo-winvm" }
# Secrets: names in fnox.toml, values in the keychain (docs/concepts/secrets.md). Same pin as the tool list.
fnox = "1.36.0"

[env]
# Every `fnox` run in this repo, `fnox exec` in the tasks included, sees only the secrets fnox.toml
# declares for claude-rig: not the rest of the global fnox config (docs/concepts/secrets.md).
FNOX_PROFILE = "claude-rig"
FNOX_NO_DEFAULTS = "true"

[tasks.rig]
description = "Rig this machine: tools, Claude Code, Claude config. Pass --dry-run to only look."
run = "nu tasks/rig.nu"

[tasks.doctor]
description = "Show what is set up on this machine and what is missing. Changes nothing. Pass --json for a machine-readable report."
run = "nu tasks/doctor.nu"

[tasks.fleet]
description = "Every rigged machine in one table: this one and each machine rigged from here with push."
run = "nu tasks/fleet.nu"

[tasks.report]
description = "Post this machine's report to fleet-api now. --print shows it and posts nothing; --list shows the fleet as fleet-api has it."
run = "nu tasks/report.nu"

[tasks.vm]
description = "A UTM VM on this Mac, made and rigged in one step: mise run vm -- new linux <name>, or rm <name>"
run = "nu tasks/vm.nu"

[tasks.unrig]
description = "Take this machine out of the fleet: stop the always-on session. Pass --dry-run to only look."
run = "nu tasks/unrig.nu"

[tasks.apply]
description = "Apply your config to this machine's ~/.claude. Pass --dry-run to only look."
run = "nu tasks/apply.nu"

[tasks.capture]
description = "Copy this machine's global Claude config (~/.claude) into your config folder"
run = "nu tasks/capture.nu"

[tasks.config]
description = "Where your Claude config comes from. mise run config -- init <folder> makes or picks the folder."
run = "nu tasks/config.nu"

[tasks.push]
description = "Rig a remote machine over SSH: mise run push user@host. Pass --dry-run to only look."
run = "nu tasks/push.nu"

[tasks.test]
description = "Run the tests: the config merge, the capture checks, where the config comes from, the claims, and the report to fleet-api, against throwaway folders"
run = ["nu tests/apply.nu", "nu tests/capture.nu", "nu tests/config.nu", "nu tests/claims.nu", "nu tests/report.nu"]

[tasks."plugin:check"]
description = "Check the Claude Code plugin in plugin/ and the marketplace file with Claude Code's own validator (needs claude)"
run = ["claude plugin validate .", "claude plugin validate plugin"]

[tasks.lint]
description = "Check the scripts"
run = [
  "shellcheck bootstrap.sh",
  "nu --commands 'for f in (glob tasks/**/*.nu | append (glob tests/*.nu)) { nu-check --debug $f }'",
]

[tasks."github:setup"]
description = "Write the issue forms and labels in .github/ from charter, keeping this repo's bug form and extra labels"
run = "nu tasks/github.nu"

[tasks."github:check"]
description = "Fail if the issue forms and labels in .github/ differ from what charter writes"
run = "nu tasks/github.nu --check"

[tasks."secrets:scan"]
description = "Fail if a file git would commit looks like it holds a secret (fnox scan)"
run = "fnox scan ."

# ---- CI: every check the workflows run, so the same command runs here ----
# The ci:* tasks rig the machine they run on: they run in CI, or with HOME set to a throwaway
# folder (docs/contributing.md).

[tasks."ci:bootstrap"]
description = "CI: check a machine the bootstrap has just rigged: tools, a run with a config, doctor, a second run, a dry run on a bare home"
run = "nu tasks/ci/bootstrap.nu"

[tasks."ci:windows-session"]
description = "CI, Windows: the always-on session starts at sign-in and stays up, with its keep-awake beside it"
run = "nu tasks/ci/always-on.nu"

[tasks."ci:sshd"]
description = "CI only, Windows: set this machine up as an SSH server with a throwaway key, for ci:push"
run = "powershell -NoProfile -ExecutionPolicy Bypass -File tasks/ci/sshd.ps1"

[tasks."ci:push"]
description = "CI only, Windows: push a rig over SSH to this machine and check what arrived"
run = "nu tasks/ci/push-windows.nu"

[tasks."ci:plugin"]
description = "plugin:check, installing Claude Code first in CI"
run = "nu tasks/ci/plugin.nu"

# ---- releases: one command and a tag ----

[tasks.release]
description = "Tag main as a release and push the tag: mise run release -- vX.Y.Z. Pass --dry-run to only check"
run = "nu tasks/release.nu"

[tasks."release:publish"]
description = "The GitHub Release for the tag the workflow runs on, with notes from the commits. Not on a tag: a dry run"
run = "nu tasks/release.nu publish"

# ---- docs: the docs site in docs/, kept the way charter keeps it ----

[tasks."docs:setup"]
description = "Write the docs site's config, docs/writing.md and docs/llms.txt (the same for every repo that uses charter)"
run = "charter docs"

[tasks."docs:lint"]
description = "Check docs/ for what a program can check: front matter, links, the index, tasks and paths that don't exist"
run = "charter docs-lint"

[tasks."docs:check"]
description = "docs:lint, and fail if the generated docs files are stale"
run = "charter docs -check && charter docs-lint"

[tasks."docs:review"]
description = "Have Claude bring docs/ up to date and into line with docs/writing.md"
run = "charter docs-review"

[tasks."docs:pages"]
description = "REMOTE, once per repo: turn on GitHub Pages for docs/ on main"
run = 'gh api -X POST "repos/{owner}/{repo}/pages" -f "source[branch]=main" -f "source[path]=/docs"'

