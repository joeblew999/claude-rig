# Runs the bootstrap on fresh macOS, Linux and Windows machines, then the checks.
# Every check is a mise task, so the same command runs locally (docs/contributing.md).
# The only other steps: the checkout, the bootstrap itself (it installs mise, so it
# cannot run under mise), and putting mise on PATH for the steps after it.
name: test

on:
  push:
    branches: [main]
    # A release is cut locally; CI then checks the tag on every OS.
    tags: ["v*"]
  pull_request:

env:
  # Lets mise read GitHub releases without hitting the anonymous rate limit.
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v5.0.1
      - run: mise run lint
      - run: mise run docs:check
      - run: mise run github:check
      - run: mise run secrets:scan
      # The runner has no keychain: the secrets fnox.toml declares are optional, so a task under
      # fnox exec still runs.
      - run: mise run push -- --help
      - run: mise run ci:plugin

  unix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      # The thing under test, on a bare runner with no config. ci:bootstrap checks what it printed.
      - run: sh bootstrap.sh | tee first-run.log
      # What a new shell on the machine has on PATH: mise, claude and the tools' shims.
      - run: printf '%s\n' "$HOME/.local/bin" "$HOME/.local/share/mise/shims" >> "$GITHUB_PATH"
      - run: mise run ci:bootstrap
      - run: mise run test

  windows:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v7.0.1
      # The thing under test, on a bare runner with no config. ci:bootstrap checks what it printed.
      - run: .\bootstrap.ps1 | Tee-Object first-run.log
      # What a new window on the machine has on PATH: the user PATH the bootstrap and the rig set.
      - run: ([Environment]::GetEnvironmentVariable('Path', 'User') -split ';') | Add-Content $env:GITHUB_PATH
      - run: mise run ci:bootstrap
      - run: mise run test
      - run: mise run ci:windows-session

  # A push over SSH to a Windows machine set up the way a real PC would be; the runner pushes
  # to itself over localhost (tasks/ci/sshd.ps1, tasks/ci/push-windows.nu).
  push-windows:
    strategy:
      fail-fast: false
      matrix:
        # The ARM64 runner takes about 20 minutes here, so it runs only on main.
        os: ${{ github.event_name == 'push' && fromJSON('["windows-latest", "windows-11-arm"]') || fromJSON('["windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: powershell
    env:
      # Rig from the branch under test, not from main.
      RIG_TEST_REF: ${{ github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v7.0.1
      # Only nushell is needed here, to run push.nu.
      - uses: jdx/mise-action@v5.0.1
        with:
          install_args: nu
      - run: mise run ci:sshd
        timeout-minutes: 40
      - run: mise run ci:push
