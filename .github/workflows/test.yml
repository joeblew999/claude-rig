# Runs the bootstrap on fresh macOS, Linux and Windows machines.
# The second run must change nothing.
name: test

on:
  push:
    branches: [main]
  pull_request:

env:
  # Lets mise read GitHub releases without hitting the anonymous rate limit.
  GITHUB_TOKEN: ${{ github.token }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: mise run lint

  unix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Dry run changes nothing
        run: |
          sh bootstrap.sh --dry-run
          test ! -e "$HOME/.config/mise/conf.d/claude-rig.toml"
          test ! -e "$HOME/.claude/.rig-manifest"

      - name: First run
        run: sh bootstrap.sh

      - name: Tools and config are in place
        run: |
          export PATH="$HOME/.local/bin:$HOME/.local/share/mise/shims:$PATH"
          claude --version
          for tool in gh jq yq rg fd node go bun nu fnox pitchfork; do
            command -v "$tool"
          done
          jq -e '.remoteControlAtStartup == true' "$HOME/.claude/settings.json"
          test -f "$HOME/.claude/skills/mise-tasks/SKILL.md"

      - name: Doctor reports this machine
        run: |
          export PATH="$HOME/.local/bin:$HOME/.local/share/mise/shims:$PATH"
          nu tasks/doctor.nu --json | tee doctor.json
          jq -e '.tools_installed and .config_applied and (.logged_in | not) and (.claude_version != null)' doctor.json

      - name: Second run changes nothing
        run: |
          sh bootstrap.sh | tee second-run.log
          if grep -E '^ +(change|would) ' second-run.log; then
            echo "The second run made changes." >&2
            exit 1
          fi

  windows:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4

      - name: Dry run changes nothing
        run: |
          .\bootstrap.ps1 -DryRun
          if (Test-Path "$HOME\.config\mise\conf.d\claude-rig.toml") { throw 'the dry run installed the tool list' }
          if (Test-Path "$HOME\.claude\.rig-manifest") { throw 'the dry run applied the config' }

      - name: First run
        run: .\bootstrap.ps1

      - name: Tools and config are in place
        run: |
          $env:Path = [Environment]::GetEnvironmentVariable('Path', 'User') + ';' + $env:Path
          claude --version
          foreach ($tool in 'gh', 'jq', 'yq', 'rg', 'fd', 'node', 'go', 'bun', 'nu', 'fnox', 'pitchfork') {
            (Get-Command $tool).Source
          }
          $settings = Get-Content "$HOME\.claude\settings.json" -Raw | ConvertFrom-Json
          if (-not $settings.remoteControlAtStartup) { throw 'remote control is not on' }
          if (-not (Test-Path "$HOME\.claude\skills\mise-tasks\SKILL.md")) { throw 'skills are missing' }

      - name: Doctor reports this machine
        run: |
          $env:Path = [Environment]::GetEnvironmentVariable('Path', 'User') + ';' + $env:Path
          $report = nu tasks\doctor.nu --json | Out-String
          $report
          $facts = $report | ConvertFrom-Json
          if (-not ($facts.tools_installed -and $facts.config_applied -and $facts.claude_version)) { throw 'the report is wrong' }
          if ($facts.logged_in) { throw 'the runner cannot be logged in' }

      - name: Second run changes nothing
        run: |
          .\bootstrap.ps1 | Tee-Object second-run.log
          if (Select-String -Path second-run.log -Pattern '^ +(change|would) ') {
            throw 'The second run made changes.'
          }

      # The runner cannot log in to Claude, so the server itself cannot connect.
      # This checks the parts around it: the sign-in entry and the keep-alive loop.
      - name: Session starts at sign-in and stays up
        env:
          RIG_ASSUME_LOGGED_IN: "1"
        run: |
          .\bootstrap.ps1
          $startup = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Startup\claude-rig.cmd"
          if (-not (Test-Path $startup)) { throw 'no sign-in entry' }
          Get-Content $startup
          Start-Sleep -Seconds 25
          $session = Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -match 'session\.nu' }
          if (-not $session) { throw 'the session is not running' }
          Get-Content "$HOME\.claude-rig-session.log" -ErrorAction SilentlyContinue | Select-Object -First 10
          .\bootstrap.ps1 | Tee-Object session-second-run.log
          if (Select-String -Path session-second-run.log -Pattern '^ +(change|would) ') {
            throw 'The second run with the session made changes.'
          }
